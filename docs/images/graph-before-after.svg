<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">NNC graph before and after compilation</title>
  <desc id="desc">Nine graph operations become three fused linear ReLU kernels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10152d"/></linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#132b49"/><stop offset="1" stop-color="#1d204d"/></linearGradient>
    <linearGradient id="fused" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#063e57"/><stop offset="1" stop-color="#42216e"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#59d8ff"/></marker>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <text x="48" y="55" fill="#d9ecff" font-family="Segoe UI,Arial" font-size="24" font-weight="700">GRAPH IR · 9 OPERATIONS</text>
  <text x="48" y="352" fill="#94a8c4" font-family="Segoe UI,Arial" font-size="16">MatMul → BiasAdd → ReLU repeated for three layers</text>
  <g font-family="Segoe UI,Arial" font-size="14" text-anchor="middle" fill="#e9f6ff">
    <g stroke="#59d8ff" stroke-width="2" marker-end="url(#arrow)">
      <path d="M145 190H180"/><path d="M290 190H325"/><path d="M435 190H470"/><path d="M580 190H615"/><path d="M725 190H760"/><path d="M870 190H905"/><path d="M1015 190H1050"/>
    </g>
    <g fill="url(#node)" stroke="#3a83b8">
      <rect x="45" y="150" width="100" height="80" rx="14"/><rect x="180" y="150" width="110" height="80" rx="14"/><rect x="325" y="150" width="110" height="80" rx="14"/>
      <rect x="470" y="150" width="110" height="80" rx="14"/><rect x="615" y="150" width="110" height="80" rx="14"/><rect x="760" y="150" width="110" height="80" rx="14"/>
      <rect x="905" y="150" width="110" height="80" rx="14"/><rect x="1050" y="150" width="110" height="80" rx="14"/>
    </g>
    <text x="95" y="195">Input</text><text x="235" y="195">MatMul</text><text x="380" y="195">BiasAdd</text><text x="525" y="195">ReLU</text>
    <text x="670" y="195">MatMul</text><text x="815" y="195">BiasAdd</text><text x="960" y="195">ReLU</text><text x="1105" y="195">… layer 3</text>
  </g>
  <path d="M600 260V300" stroke="#b06cff" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="255" y="305" width="690" height="82" rx="18" fill="url(#fused)" stroke="#8d62ff"/>
  <g font-family="Segoe UI,Arial" text-anchor="middle">
    <text x="600" y="337" fill="#cbb8ff" font-size="14" font-weight="700">COMPILED PLAN · 3 OPERATIONS</text>
    <text x="370" y="370" fill="#fff" font-size="17">FusedLinearReLU</text><text x="600" y="370" fill="#fff" font-size="17">FusedLinearReLU</text><text x="830" y="370" fill="#fff" font-size="17">FusedLinearReLU</text>
  </g>
</svg>
